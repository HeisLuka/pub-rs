[workspace]
resolver = "2"
members = ["crates/pub-core","crates/pub-cfb","crates/pub-contents","crates/pub-quill","crates/pub-escher","crates/pub-model","crates/pub-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/HeisLuka/pub-rs"

[workspace.dependencies]
anyhow = "1"
cfb = "0.14"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
