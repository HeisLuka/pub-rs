name: Исследование DOCUMENT PageList

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - research/verify-document-pagelist-wire

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'research/verify-document-pagelist-wire' || github.ref_name == 'research/verify-document-pagelist-wire'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Установить минимальный OLE-ридер
        run: python -m pip install --disable-pip-version-check olefile
      - name: Проверить wire DOCUMENT PageList
        run: python .github/scripts/verify_document_pagelist.py
