name: Основные проверки
on:
  pull_request:
    paths: ["**/*.rs","**/Cargo.toml","Cargo.toml","Cargo.lock","rust-toolchain.toml"]
  push:
    branches: [main]
    paths: ["**/*.rs","**/Cargo.toml","Cargo.toml","Cargo.lock","rust-toolchain.toml"]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Установить OLE-ридер для исследовательской ветки
        if: github.head_ref == 'research/verify-contents-trailer-root'
        run: python -m pip install --disable-pip-version-check olefile
      - name: Прямо проверить байты Contents trailer
        if: github.head_ref == 'research/verify-contents-trailer-root'
        run: python .github/scripts/verify_contents_trailer.py
