name: Исследование ранних носителей Publisher

on:
  push:
    branches:
      - research/early-publisher-media-census

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Установить инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full cabextract mscompress
          python -m pip install --disable-pip-version-check olefile

      - name: Скачать архивные дистрибутивы
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -L --fail --retry 3 -o downloads/pub1.bin \
            'https://winworldpc.com/download/c3a668c2-81c5-bec2-a1c2-a111c3a4c2ac/from/c39ac2af-c381-c2bf-1b25-11c3a4e284a2'
          curl -L --fail --retry 3 -o downloads/pub2a.bin \
            'https://winworldpc.com/download/4576c385-7918-c39a-11c3-a4e284a2c3a5/from/c39ac2af-c381-c2bf-1b25-11c3a4e284a2'
          curl -L --fail --retry 3 -o downloads/pub95.bin \
            'https://winworldpc.com/download/cc7c6384-6607-11ea-8c4a-fa163e9022f0/from/c39ac2af-c381-c2bf-1b25-11c3a4e284a2'
          sha256sum downloads/* | tee download-sha256.txt
          file downloads/* | tee download-filetypes.txt

      - name: Рекурсивно раскрыть архивы и образы
        shell: python
        run: |
          import os
          import pathlib
          import shutil
          import subprocess

          roots = {
              "publisher1": pathlib.Path("downloads/pub1.bin"),
              "publisher2a": pathlib.Path("downloads/pub2a.bin"),
              "publisher95": pathlib.Path("downloads/pub95.bin"),
          }

          outroot = pathlib.Path("expanded")
          outroot.mkdir(exist_ok=True)

          nested_exts = {".7z", ".zip", ".iso", ".img", ".ima", ".cab"}

          for label, src in roots.items():
              root = outroot / label
              root.mkdir(parents=True, exist_ok=True)
              subprocess.run(["7z", "x", "-y", str(src), f"-o{root}"], check=True, stdout=subprocess.DEVNULL)
              seen = set()
              for depth in range(4):
                  candidates = []
                  for p in root.rglob("*"):
                      if not p.is_file():
                          continue
                      if p.suffix.lower() in nested_exts and p not in seen:
                          candidates.append(p)
                  if not candidates:
                      break
                  for p in candidates:
                      seen.add(p)
                      target = p.parent / (p.name + ".x")
                      target.mkdir(exist_ok=True)
                      subprocess.run(
                          ["7z", "x", "-y", str(p), f"-o{target}"],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                          check=False,
                      )

          # Expand classic Microsoft SZDD *.PU_ candidates to *.pub without deleting source.
          szdd_out = pathlib.Path("szdd_pub")
          szdd_out.mkdir(exist_ok=True)
          idx = 0
          for p in outroot.rglob("*"):
              if not p.is_file() or not p.name.lower().endswith(".pu_"):
                  continue
              idx += 1
              target = szdd_out / f"{idx:04d}_{p.stem}.pub"
              with target.open("wb") as out:
                  proc = subprocess.run(["msexpand", str(p)], stdout=out, stderr=subprocess.PIPE)
              if proc.returncode != 0 or target.stat().st_size == 0:
                  target.unlink(missing_ok=True)

      - name: Снять census и fingerprints
        shell: python
        run: |
          import hashlib
          import io
          import json
          import pathlib
          import struct

          import olefile

          def u16(data, off):
              return struct.unpack_from("<H", data, off)[0] if off + 2 <= len(data) else None

          def fingerprint(path):
              raw = path.read_bytes()
              item = {
                  "path": str(path),
                  "name": path.name,
                  "size": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "prefix32": raw[:32].hex(),
                  "legacy_pub1_magic": raw.startswith(bytes.fromhex("e7ac2c00")),
                  "cfb_magic": raw.startswith(bytes.fromhex("d0cf11e0a1b11ae1")),
              }
              if olefile.isOleFile(io.BytesIO(raw)):
                  ole = olefile.OleFileIO(io.BytesIO(raw))
                  item["root_clsid"] = str(getattr(ole.root, "clsid", None))
                  paths = ["/".join(p) for p in ole.listdir(streams=True, storages=True)]
                  item["ole_paths"] = paths
                  if ole.exists("Contents"):
                      contents = ole.openstream("Contents").read()
                      v0 = u16(contents, 4)
                      v2 = u16(contents, 12)
                      item["contents"] = {
                          "size": len(contents),
                          "family_word": u16(contents, 2),
                          "version0": v0,
                          "version2": v2,
                          "resolved_old_version": v2 if v0 == 300 else v0,
                          "revision_u16_at_0c": u16(contents, 12),
                      }
                  item["has_quill"] = any(p == "Quill" or p.startswith("Quill/") for p in paths)
                  ole.close()
              return item

          roots = [pathlib.Path("expanded"), pathlib.Path("szdd_pub")]
          pub_files = []
          compressed_pub = []
          interesting = []

          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  low = p.name.lower()
                  if low.endswith(".pub"):
                      pub_files.append(p)
                  if low.endswith(".pu_"):
                      compressed_pub.append(p)
                  if (
                      "pub" in low
                      or "templ" in low
                      or "wizard" in low
                      or low.endswith((".des", ".poc", ".tpl", ".wiz"))
                  ):
                      interesting.append(str(p))

          # deduplicate identical extracted paths by SHA but keep provenance paths separately
          fps = [fingerprint(p) for p in pub_files]
          report = {
              "pub_count": len(fps),
              "compressed_pub_count": len(compressed_pub),
              "pub_files": fps,
              "compressed_pub_paths": [str(p) for p in compressed_pub],
              "interesting_paths": sorted(interesting),
          }

          with open("early-media-report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          print("PUB_COUNT", report["pub_count"])
          print("COMPRESSED_PUB_COUNT", report["compressed_pub_count"])
          for item in fps:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))

      - name: Сохранить только отчёт
        uses: actions/upload-artifact@v4
        with:
          name: early-publisher-media-census
          path: |
            download-sha256.txt
            download-filetypes.txt
            early-media-report.json
          if-no-files-found: error
          retention-days: 7
