name: Исследование публичного корпуса PUB

on:
  push:
    branches:
      - research/public-corpus-acquisition-2026-09-19

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Установить минимальный OLE-ридер
        run: python -m pip install --disable-pip-version-check olefile
      - name: Скачать и отпечатать публичные PUB без сохранения бинарников
        shell: python
        run: |
          import hashlib
          import io
          import json
          import struct
          import urllib.error
          import urllib.request

          import olefile

          sources = [
              {
                  "name": "UK Willingham Newsletter Summer 2022",
                  "country": "GB",
                  "url": "https://willingham-by-stow.parish.lincolnshire.gov.uk/downloads/file/343/newsletter-summer-2022",
              },
              {
                  "name": "Germany Jena Roll-Up template",
                  "country": "DE",
                  "url": "https://www.uni-jena.de/unijenamedia/364815/rollup-tem-pub.pub",
              },
              {
                  "name": "USA Adelphi Program Flyer",
                  "country": "US",
                  "url": "https://www.adelphi.edu/brand/wp-content/uploads/sites/55/2020/08/Adelphi_ProgramFlyer.pub",
              },
              {
                  "name": "USA Adelphi Event Flyer",
                  "country": "US",
                  "url": "https://www.adelphi.edu/brand/wp-content/uploads/sites/55/2020/08/Adelphi_EventFlyer.pub",
              },
              {
                  "name": "USA Adelphi One Page",
                  "country": "US",
                  "url": "https://www.adelphi.edu/brand/wp-content/uploads/sites/55/2020/08/Adelphi-OnePage.pub",
              },
              {
                  "name": "USA Adelphi TriFold",
                  "country": "US",
                  "url": "https://www.adelphi.edu/brand/wp-content/uploads/sites/55/2020/08/Adelphi-TriFold.pub",
              },
              {
                  "name": "USA Adelphi Newsletter",
                  "country": "US",
                  "url": "https://www.adelphi.edu/brand/wp-content/uploads/sites/55/2020/08/Adelphi-Newsletter.pub",
              },
              {
                  "name": "USA Wichita 8.5x11 full bleed template",
                  "country": "US",
                  "url": "https://www.wichita.edu/services/printing/_documents/Publisher_8.5x11_portrait_fullbleed_template.pub",
              },
              {
                  "name": "Netherlands BookCrossing Dettie color labels",
                  "country": "NL",
                  "url": "https://www.bookcrossing.nl/down/labelsdettie.kl.pub",
              },
              {
                  "name": "Netherlands BookCrossing Dettie black-white labels",
                  "country": "NL",
                  "url": "https://www.bookcrossing.nl/down/labelsdettie.zw_w.pub",
              },
              {
                  "name": "Netherlands BookCrossing Yvonnep label",
                  "country": "NL",
                  "url": "https://www.bookcrossing.nl/down/bookcrossing-yvonnep.pub",
              },
              {
                  "name": "Netherlands BookCrossing Crossing the World",
                  "country": "NL",
                  "url": "https://www.bookcrossing.nl/down/crossingtheworld.pub",
              },
              {
                  "name": "Netherlands BookCrossing Goed Boek",
                  "country": "NL",
                  "url": "https://www.bookcrossing.nl/down/goedboek-yvonnep.pub",
              },
              {
                  "name": "Netherlands BookCrossing Hadewychshuis sticker sheet",
                  "country": "NL",
                  "url": "https://www.bookcrossing.nl/down/hadewychshuis-stickervelenvelop.pub",
              },
              {
                  "name": "Online-Convert example.pub",
                  "country": "INT",
                  "url": "https://example-files.online-convert.com/document/pub/example.pub",
              },
              {
                  "name": "Online-Convert example_multipage.pub",
                  "country": "INT",
                  "url": "https://example-files.online-convert.com/document/pub/example_multipage.pub",
              },
              {
                  "name": "France Maitresseuh planner header",
                  "country": "FR",
                  "url": "https://ekladata.com/2vTrCQolpimG6CEtoUxcJ1tdXcs/00.-Planner-Maitresseuh-en-tete.pub",
              },
              {
                  "name": "France Maitresseuh schools 1-8",
                  "country": "FR",
                  "url": "https://ekladata.com/0EWlvfJz23p_TIqA-SOHPhyfKig/01.-Planner-Maitresseuh-secteur-ecoles-1-a-8.pub",
              },
              {
                  "name": "France Maitresseuh schools",
                  "country": "FR",
                  "url": "https://ekladata.com/H9Wdzyy9KeBpsfgYFZmvtz__N8c/01.-Planner-Maitresseuh-secteur-ecoles.pub",
              },
              {
                  "name": "France Maitresseuh interventions",
                  "country": "FR",
                  "url": "https://ekladata.com/6bS767rD6BKh3hKt3XZWgfL4gIw/02.-Planner-Maitresseuh-Organisation-interventions.pub",
              },
              {
                  "name": "France Maitresseuh annexes",
                  "country": "FR",
                  "url": "https://ekladata.com/iis16vr3FNEvxjxCd837W_s6y7Y/04.-Planner-Maitresseuh-Annexes.pub",
              },
          ]

          def clean(value):
              if isinstance(value, bytes):
                  return value.decode("utf-8", "replace")
              if value is None:
                  return None
              return str(value)

          def read_u16(data, offset):
              if offset + 2 > len(data):
                  return None
              return struct.unpack_from("<H", data, offset)[0]

          def read_u32(data, offset):
              if offset + 4 > len(data):
                  return None
              return struct.unpack_from("<I", data, offset)[0]

          def ole_props(ole, stream_name):
              try:
                  return ole.getproperties(stream_name)
              except Exception:
                  return {}

          report = []

          for source in sources:
              item = dict(source)
              item["download_ok"] = False
              try:
                  request = urllib.request.Request(
                      source["url"],
                      headers={
                          "User-Agent": "pub-rs-corpus-research/1.0 (+https://github.com/HeisLuka/pub-rs)"
                      },
                  )
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      item["http_status"] = getattr(response, "status", None)
                      item["content_type"] = response.headers.get_content_type()
                      item["content_length_header"] = response.headers.get("Content-Length")
                      item["final_url"] = response.geturl()
                  item["download_ok"] = True
                  item["size"] = len(raw)
                  item["sha256"] = hashlib.sha256(raw).hexdigest()
                  item["prefix32"] = raw[:32].hex()
                  item["legacy_pub1_magic"] = raw.startswith(bytes.fromhex("e7ac2c00"))
                  item["cfb_magic"] = raw.startswith(bytes.fromhex("d0cf11e0a1b11ae1"))
                  item["looks_html"] = raw[:256].lstrip().lower().startswith(
                      (b"<!doctype html", b"<html", b"<head")
                  )

                  if olefile.isOleFile(io.BytesIO(raw)):
                      item["is_ole"] = True
                      ole = olefile.OleFileIO(io.BytesIO(raw))
                      paths = ["/".join(parts) for parts in ole.listdir(streams=True, storages=True)]
                      item["ole_paths"] = paths
                      item["root_clsid"] = clean(getattr(ole.root, "clsid", None))
                      metadata = ole.get_metadata()
                      item["metadata"] = {
                          "title": clean(getattr(metadata, "title", None)),
                          "author": clean(getattr(metadata, "author", None)),
                          "last_saved_by": clean(getattr(metadata, "last_saved_by", None)),
                          "creating_application": clean(
                              getattr(metadata, "creating_application", None)
                          ),
                          "create_time": clean(getattr(metadata, "create_time", None)),
                          "last_saved_time": clean(
                              getattr(metadata, "last_saved_time", None)
                          ),
                      }
                      summary = ole_props(ole, "\x05SummaryInformation")
                      doc_summary = ole_props(ole, "\x05DocumentSummaryInformation")
                      item["summary_app_name_prop18"] = clean(summary.get(18))
                      item["piddsi_version_prop23"] = doc_summary.get(23)

                      if ole.exists("Contents"):
                          contents = ole.openstream("Contents").read()
                          item["contents"] = {
                              "size": len(contents),
                              "prefix64": contents[:64].hex(),
                              "byte0": contents[0] if contents else None,
                              "revision_u16_at_0c": read_u16(contents, 0x0C),
                              "u32_at_16": read_u32(contents, 0x16),
                              "u32_at_1a": read_u32(contents, 0x1A),
                          }
                      item["has_quill"] = any(p == "Quill" or p.startswith("Quill/") for p in paths)
                      item["has_escher_stm"] = "EscherStm" in paths
                      item["has_escher_delay_stm"] = "EscherDelayStm" in paths
                      ole.close()
                  else:
                      item["is_ole"] = False

              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {exc}"

              report.append(item)
              print(json.dumps(item, ensure_ascii=False, default=str, sort_keys=True))

          with open("corpus-report.json", "w", encoding="utf-8") as output:
              json.dump(report, output, ensure_ascii=False, indent=2, default=str)

          ok = sum(1 for item in report if item.get("download_ok"))
          ole_count = sum(1 for item in report if item.get("is_ole"))
          print()
          print(f"ИТОГО: скачано={ok}/{len(report)} OLE={ole_count}/{len(report)}")
      - name: Сохранить только отчёт без чужих бинарников
        uses: actions/upload-artifact@v4
        with:
          name: public-corpus-report
          path: corpus-report.json
          if-no-files-found: error
          retention-days: 7


  type12-width-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Установить минимальный OLE-ридер
        run: python -m pip install --disable-pip-version-check olefile
      - name: Проверить Type12 target framing на известных oracle и новом Publisher 11 корпусе
        shell: python
        run: |
          import hashlib
          import io
          import json
          import struct
          import urllib.parse
          import urllib.request

          import olefile

          # Все URL привязаны к immutable commit. Бинарники живут только
          # в памяти runner и не записываются в git/artifact.
          sources = [
              {
                  "name": "oracle-ec2asp",
                  "role": "self-check",
                  "url": "https://raw.githubusercontent.com/azreasoners/ARG-webpage---Archived/faf75b2996bb7f984365b9d4cb737af39c529ac6/ecasp/ec2asp.pub",
                  "expect_scalars": [[2, 358], [2, 266]],
              },
              {
                  "name": "oracle-help",
                  "role": "self-check",
                  "url": "https://raw.githubusercontent.com/Planet-Source-Code/hartoto-flexible-phoone-book__1-69597/1400f033db5f4a57cca6d5392f551943271b7f72/help.pub",
                  "expect_scalars": [[2, 266]],
              },
              {
                  "name": "apache-sample98",
                  "role": "lineage-control",
                  "url": "https://raw.githubusercontent.com/apache/poi/b66d71f85030b060df543702d8c0d64dfac922c3/test-data/publisher/Sample98.pub",
                  "expect_scalars": [[1, 266]],
              },
              {
                  "name": "apache-sample2000",
                  "role": "lineage-control",
                  "url": "https://raw.githubusercontent.com/apache/poi/b66d71f85030b060df543702d8c0d64dfac922c3/test-data/publisher/Sample2000.pub",
                  "expect_scalars": [[1, 266]],
              },
              {
                  "name": "apache-sample2007",
                  "role": "lineage-control",
                  "url": "https://raw.githubusercontent.com/apache/poi/b66d71f85030b060df543702d8c0d64dfac922c3/test-data/publisher/Sample.pub",
                  "expect_scalars": [[1, 266]],
              },
              {
                  "name": "apache-sample2010",
                  "role": "lineage-control",
                  "url": "https://raw.githubusercontent.com/apache/poi/b66d71f85030b060df543702d8c0d64dfac922c3/test-data/publisher/Sample_2010.pub",
                  "expect_scalars": [[1, 266]],
              },
              {
                  "name": "virtual-labs-web-master-root",
                  "role": "new-corpus",
                  "url": "https://raw.githubusercontent.com/virtual-labs/virtual-smart-structures-and-dynamics-laboratory-iitd/665a5bd751d5e95393d45a74e3d7dcdab2fd56ed/src/lab/Web%20Master%20Vinod%20Sharma.pub",
              },
              {
                  "name": "virtual-labs-web-master-web-site",
                  "role": "new-corpus",
                  "url": "https://raw.githubusercontent.com/virtual-labs/virtual-smart-structures-and-dynamics-laboratory-iitd/665a5bd751d5e95393d45a74e3d7dcdab2fd56ed/src/lab/web_site/Web%20Master%20Vinod%20Sharma.pub",
              },
          ]

          def u16(data, off):
              if off < 0 or off + 2 > len(data):
                  raise ValueError(f"u16 out of bounds: {off}/{len(data)}")
              return struct.unpack_from("<H", data, off)[0]

          def u32(data, off):
              if off < 0 or off + 4 > len(data):
                  raise ValueError(f"u32 out of bounds: {off}/{len(data)}")
              return struct.unpack_from("<I", data, off)[0]

          def get_quill(raw):
              ole = olefile.OleFileIO(io.BytesIO(raw))
              try:
                  path = ["Quill", "QuillSub", "CONTENTS"]
                  if not ole.exists(path):
                      raise ValueError("Quill/QuillSub/CONTENTS отсутствует")
                  return ole.openstream(path).read(), (
                      ole.openstream("Contents").read()
                      if ole.exists("Contents")
                      else b""
                  )
              finally:
                  ole.close()

          def quill_descriptors(quill):
              # libmspub MSPUBParser::parseQuill /
              # parseQuillChunkReference: linked lists start at 0x18,
              # each descriptor is exactly 24 bytes.
              out = []
              list_off = 0x18
              seen = set()
              for _ in range(256):
                  if list_off == 0xFFFFFFFF:
                      return out
                  if list_off in seen:
                      raise ValueError(f"cycle in Quill descriptor lists at 0x{list_off:X}")
                  seen.add(list_off)
                  if list_off + 8 > len(quill):
                      raise ValueError(f"descriptor list out of bounds: 0x{list_off:X}")
                  count = u16(quill, list_off + 2)
                  next_off = u32(quill, list_off + 4)
                  pos = list_off + 8
                  if pos + count * 24 > len(quill):
                      raise ValueError(
                          f"{count} descriptors exceed Quill at 0x{list_off:X}"
                      )
                  for _idx in range(count):
                      marker = u16(quill, pos)
                      name = quill[pos + 2:pos + 6].decode("latin1")
                      ident = u16(quill, pos + 6)
                      opt = u32(quill, pos + 8)
                      name2 = quill[pos + 12:pos + 16].decode("latin1")
                      offset = u32(quill, pos + 16)
                      length = u32(quill, pos + 20)
                      if offset + length > len(quill):
                          raise ValueError(
                              f"descriptor {name}/{ident} exceeds Quill: "
                              f"{offset}+{length}>{len(quill)}"
                          )
                      out.append({
                          "marker": marker,
                          "name": name,
                          "id": ident,
                          "opt": opt,
                          "name2": name2,
                          "offset": offset,
                          "length": length,
                      })
                      pos += 24
                  list_off = next_off
              raise ValueError("too many Quill descriptor-list nodes")

          def find_target_sections(payload, plc_count):
              # OBS-014 / PUBTool v0.25 structural locator.
              # Header:
              #   u32 postFixedPayloadSize
              #   u32 count
              #   u32 serviceToken
              #   u32 zero
              #   u32 zero
              #   u32 offsets[count]
              # Records are addressed from the offset-table base.
              #
              # We deliberately do not use Apache POI's historical fixed
              # oneStartsAt/twoStartsAt formulas.
              min_off = 8 + 4 * (plc_count + 2)
              min_header = 20 + 4 * plc_count
              hits = []
              for h in range(min_off, len(payload) - min_header + 1, 2):
                  try:
                      post_size = u32(payload, h)
                      count = u32(payload, h + 4)
                      service = u32(payload, h + 8)
                      zero0 = u32(payload, h + 12)
                      zero1 = u32(payload, h + 16)
                  except ValueError:
                      continue
                  if count != plc_count or zero0 != 0 or zero1 != 0:
                      continue
                  base = h + 20
                  if base + 4 * count > len(payload):
                      continue
                  offsets = [u32(payload, base + 4 * i) for i in range(count)]
                  if count:
                      if offsets[0] != 4 * count:
                          continue
                      if offsets != sorted(offsets) or len(set(offsets)) != len(offsets):
                          continue
                  # Strong invariant from OBS-014: payload size is measured
                  # from offset-table base to descriptor end.
                  if post_size != len(payload) - base:
                      continue
                  if any(off < 4 * count or off >= post_size for off in offsets):
                      continue

                  records = []
                  valid = True
                  for i, rel in enumerate(offsets):
                      start = base + rel
                      end = base + (offsets[i + 1] if i + 1 < count else post_size)
                      if start + 2 > end or end > len(payload):
                          valid = False
                          break
                      units = u16(payload, start)
                      expected = 2 + 2 * units
                      raw_record = payload[start:end]
                      record = {
                          "index": i,
                          "relative_offset": rel,
                          "start": start,
                          "end": end,
                          "size": len(raw_record),
                          "payload_units": units,
                          "record_hex": raw_record.hex(),
                          "exact_count_prefixed_size": expected == len(raw_record),
                      }
                      if expected == len(raw_record):
                          body = raw_record[2:]
                          try:
                              text = body.decode("utf-16le")
                          except UnicodeDecodeError:
                              text = None
                          printable = bool(text) and all(
                              (ch >= " " or ch in "\t\r\n") and ch != "\x00"
                              for ch in text
                          )
                          if printable:
                              record["utf16_text"] = text
                          if units in (1, 2):
                              record["compact_scalar_shape"] = True
                              record["scalar_le"] = int.from_bytes(body, "little")
                          else:
                              record["compact_scalar_shape"] = False
                      records.append(record)
                  if not valid:
                      continue

                  hits.append({
                      "header_offset": h,
                      "post_fixed_payload_size": post_size,
                      "count": count,
                      "service_token": service,
                      "offset_table_base": base,
                      "offsets": offsets,
                      "records": records,
                  })
              return hits

          def extract_story_texts(quill, descriptors):
              # libmspub STRS/TEXT join: STRS stores character lengths,
              # TEXT is their concatenated UTF-16LE payload.
              strs = next((d for d in descriptors if d["name"] == "STRS"), None)
              text = next((d for d in descriptors if d["name"] == "TEXT"), None)
              if not strs or not text:
                  return {}
              payload = quill[strs["offset"]:strs["offset"] + strs["length"]]
              if len(payload) < 8:
                  return {}
              count = u32(payload, 0)
              rel = u32(payload, 4)
              lengths_off = 4 + rel
              if count > 10000 or lengths_off + 4 * count > len(payload):
                  return {}
              lengths = [u32(payload, lengths_off + 4 * i) for i in range(count)]
              text_bytes = quill[text["offset"]:text["offset"] + text["length"]]
              out = {}
              pos = 0
              for i, chars in enumerate(lengths):
                  size = chars * 2
                  if pos + size > len(text_bytes):
                      break
                  story = text_bytes[pos:pos + size].decode("utf-16le", "replace")
                  out[i] = story
                  pos += size
              return out

          def scan(raw):
              quill, contents = get_quill(raw)
              descriptors = quill_descriptors(quill)
              stories = extract_story_texts(quill, descriptors)
              tokens = []
              for d in descriptors:
                  if d["name"] != "TOKN":
                      continue
                  payload = quill[d["offset"]:d["offset"] + d["length"]]
                  if len(payload) < 8:
                      continue
                  plc_count = u32(payload, 0)
                  plc_type = u32(payload, 4)
                  if plc_type != 12 or plc_count > 1000:
                      continue
                  sections = find_target_sections(payload, plc_count)
                  first_header = min(
                      (sec["header_offset"] for sec in sections),
                      default=len(payload),
                  )
                  tag22 = []
                  # Confirmed Quill block packing: id byte + type 0x22 + u32.
                  # Report raw occurrences only; semantic labels are assigned
                  # later from the canonical 0x2200/01/02 joins.
                  for pos in range(0, max(0, first_header - 5)):
                      if payload[pos] in (0, 1, 2) and payload[pos + 1] == 0x22:
                          tag22.append({
                              "offset": pos,
                              "id": payload[pos],
                              "value_u32": u32(payload, pos + 2),
                          })
                  tokens.append({
                      "descriptor": d,
                      "plc_count": plc_count,
                      "plc_type": plc_type,
                      "story_text": stories.get(d["id"], "")[:500],
                      "tag22_occurrences_before_target": tag22,
                      "target_sections": sections,
                  })
              scalars = []
              for tok in tokens:
                  for sec in tok["target_sections"]:
                      for rec in sec["records"]:
                          if rec.get("compact_scalar_shape"):
                              scalars.append({
                                  "tokn_id": tok["descriptor"]["id"],
                                  "plc_count": tok["plc_count"],
                                  "payload_units": rec["payload_units"],
                                  "scalar_le": rec["scalar_le"],
                                  "record_hex": rec["record_hex"],
                              })
              return {
                  "quill_size": len(quill),
                  "contents_revision_u16_at_0c": (
                      u16(contents, 0x0C) if len(contents) >= 0x0E else None
                  ),
                  "descriptors": descriptors,
                  "type12": tokens,
                  "compact_scalar_records": scalars,
              }

          report = []
          oracle_ok = True
          for source in sources:
              item = {k: v for k, v in source.items() if k != "expect_scalars"}
              try:
                  req = urllib.request.Request(
                      source["url"],
                      headers={"User-Agent": "pub-rs-type12-research/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read()
                  item["size"] = len(raw)
                  item["sha256"] = hashlib.sha256(raw).hexdigest()
                  item["scan"] = scan(raw)
                  actual = [
                      [r["payload_units"], r["scalar_le"]]
                      for r in item["scan"]["compact_scalar_records"]
                  ]
                  if "expect_scalars" in source:
                      missing = [
                          pair for pair in source["expect_scalars"]
                          if pair not in actual
                      ]
                      item["self_check_expected"] = source["expect_scalars"]
                      item["self_check_missing"] = missing
                      item["self_check_ok"] = not missing
                      oracle_ok = oracle_ok and not missing
              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {exc}"
                  if source["role"] == "self-check":
                      oracle_ok = False
              report.append(item)
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))

          # Новые файлы не считаются классифицированными, если наш scanner
          # не воспроизвёл уже подтверждённые ec2asp/help oracle.
          if not oracle_ok:
              raise SystemExit("SELF-CHECK FAILED: новые corpus результаты недействительны")

          with open("type12-width-report.json", "w", encoding="utf-8") as output:
              json.dump(report, output, ensure_ascii=False, indent=2)

      - name: Сохранить только Type12 JSON без чужих бинарников
        uses: actions/upload-artifact@v4
        with:
          name: type12-width-report
          path: type12-width-report.json
          if-no-files-found: error
          retention-days: 7
